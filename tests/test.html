<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テスト実行中…</title>
<style>
body{font-family:"Yu Gothic UI","Meiryo",sans-serif;margin:16px;line-height:1.5;color:#222}
h1{font-size:18px;margin:0 0 8px}

<body>
<h1>WorkOut Note 自動テスト（calc / store / Firebase同期）</h1>
<div id="summary">実行中…</div>
<div id="fails"></div>
<div id="out"></div>
<script type="module">
const out = document.getElementById('out'), failsEl = document.getElementById('fails'), summary = document.getElementById('summary');
let pass = 0, fail = 0, curList = null;
const failures = [];
const escH = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function group(name) { const h = document.createElement('h2'); h.textContent = name; out.appendChild(h); curList = document.createElement('ul'); out.appendChild(curList); }
async function test(name, fn) {
  const li = document.createElement('li');
  try { await fn(); pass++; li.className = 'pass'; li.textContent = 'PASS  ' + name; }
  catch (e) { fail++; failures.push(name + ' — ' + e.message); li.className = 'fail'; li.innerHTML = 'FAIL  ' + escH(name) + '<pre>' + escH(e.message) + '</pre>'; }
  curList.appendChild(li);
}
const show = v => (v === undefined ? 'undefined' : JSON.stringify(v));
function eq(actual, expected, msg) { if (show(actual) !== show(expected)) throw new Error((msg ? msg + ': ' : '') + 'expected ' + show(expected) + ' / actual ' + show(actual)); }
function ok(v, msg) { if (!v) throw new Error(msg || 'expected truthy'); }
function near(actual, expected, msg) { if (Math.abs(actual - expected) > 1e-9) throw new Error((msg ? msg + ': ' : '') + 'expected ' + expected + ' / actual ' + actual); }
function finish() {
  const text = 'PASS ' + pass + ' / FAIL ' + fail;
  summary.textContent = text; summary.className = fail ? 'ng' : 'ok';
  document.title = (fail ? 'NG ' : 'OK ') + text;
  if (fail) failsEl.innerHTML = '<h2>失敗したテスト</h2><ul>' + failures.map(f => '<li class="fail">' + escH(f) + '</li>').join('') + '</ul>';
  window.__TEST_RESULT__ = { pass, fail, failures };
}

/** localStorage 互換のメモリ実装（実データには触れない） */
class MemStorage {
  constructor() { this.m = new Map(); this.failWrites = false; }
  getItem(k) { return this.m.has(k) ? this.m.get(k) : null; }
  setItem(k, v) { if (this.failWrites) throw new DOMException('quota', 'QuotaExceededError'); this.m.set(k, String(v)); }
  removeItem(k) { this.m.delete(k); }
  get length() { return this.m.size; }
  key(i) { return [...this.m.keys()][i] ?? null; }
  json(k) { const v = this.getItem(k); return v == null ? null : JSON.parse(v); }
}

let C, St, D, F, M, AU, CL, CFG, PL;
try {
  C = await import('../app/js/calc.js');
  St = await import('../app/js/store.js');
  D = await import('../app/js/defaults.js');
  F = await import('../app/js/store-firebase.js');
  M = await import('../app/js/migrate.js');
  AU = await import('../app/js/auth.js');
  CL = await import('../app/js/cloud.js');
  CFG = await import('../app/js/firebase-config.js');
  PL = await import('../app/js/photo-layout.js');
} catch (e) {
  group('読み込み'); await test('モジュールの import', () => { throw e; }); finish(); throw e;
}
const set = (w, r, memo = '', assist = false) => ({ w, r, memo, assist });
const dayOf = (...items) => ({ memo: '', items });

/* ================= calc: 1RM・フォーマット ================= */
group('calc: 推定1RM（仕様書4章の検算値）');
await test('35kg×15回 → 48.13', () => eq(C.f2(C.rm(35, 15)), '48.13'));
await test('35kg×20回 → 52.50', () => eq(C.f2(C.rm(35, 20)), '52.50'));
await test('58kg×33回 → 105.85', () => eq(C.f2(C.rm(58, 33)), '105.85'));
await test('履歴カードの MAX は小数1桁（48.125 → 48.1）', () => eq(C.f1(C.rm(35, 15)), '48.1'));
await test('w が空(null)なら 0kg 扱い → RM 0', () => eq(C.rm(null, 10), 0));
await test('RM計算機: 1RM 100 → 10回の目安 80.0', () => eq(C.f1(C.weightForReps(100, 10)), '80.0'));
await test('f2 の四捨五入（1.005 → 1.01, 2.675 → 2.68）', () => { eq(C.f2(1.005), '1.01'); eq(C.f2(2.675), '2.68'); });
await test('fw: 70 → 70.0 / 77.5 → 77.5 / 21.25 → 21.25 / null → 0.0', () => { eq(C.fw(70), '70.0'); eq(C.fw(77.5), '77.5'); eq(C.fw(21.25), '21.25'); eq(C.fw(null), '0.0'); });

group('calc: 有効セット・ボリューム');
await test('有効セットは r > 0', () => { ok(C.isValidSet(set(50, 1))); ok(!C.isValidSet(set(50, 0))); ok(!C.isValidSet(set(50, null))); ok(!C.isValidSet(null)); });
await test('w が空でも r > 0 なら有効（0kg 扱い）', () => { ok(C.isValidSet(set(null, 10))); eq(C.itemVol({ ex: 'a', sets: [set(null, 10)] }), 0); });
await test('ボリューム = Σ(w×r)、無効セットは除外', () => eq(C.itemVol({ ex: 'a', sets: [set(70, 10), set(77.5, 8), set(80, 0), set(60, null)] }), 1320));
await test('itemRM は有効セットの最大', () => near(C.itemRM({ ex: 'a', sets: [set(70, 10), set(77.5, 8), set(200, 0)] }), 93));
await test('dayVol は種目の合計', () => eq(C.dayVol(dayOf({ ex: 'a', sets: [set(10, 10)] }, { ex: 'b', sets: [set(20, 5)] })), 200));
await test('dayVol(undefined) は 0', () => eq(C.dayVol(undefined), 0));
await test('トン表示は kg÷1000 の小数2桁', () => { eq(C.ton(1320), '1.32'); eq(C.ton(0), '0.00'); eq(C.ton(12345), '12.35'); });
await test('乗り物換算（小数1桁）', () => { eq(C.vehicles(3000, C.VEHICLES.car), '2.0'); eq(C.vehicles(7500, C.VEHICLES.bus), '0.5'); eq(C.vehicles(35000, C.VEHICLES.plane), '0.1'); });
await test('isTrained: 有効セットが1つ以上', () => { ok(C.isTrained(dayOf({ ex: 'a', sets: [set(1, 1)] }))); ok(!C.isTrained(dayOf({ ex: 'a', sets: [set(1, 0)] }))); ok(!C.isTrained({ memo: 'x', items: [] })); ok(!C.isTrained(null)); });

/* ================= calc: 日付 ================= */
group('calc: 日付ユーティリティ（ローカル時刻）');
await test('dateKey はゼロ埋め', () => eq(C.dateKey(new Date(2026, 0, 5)), '2026-01-05'));
await test('深夜0:30でもローカル日付（UTCずれ無し）', () => eq(C.dateKey(new Date(2026, 8, 17, 0, 30)), '2026-09-17'));
await test('23:59でもローカル日付', () => eq(C.todayKey(new Date(2026, 8, 17, 23, 59, 59)), '2026-09-17'));
await test('fromKey → dateKey の往復', () => { eq(C.dateKey(C.fromKey('2026-12-31')), '2026-12-31'); eq(C.fromKey('2026-03-01').getHours(), 0); });
await test('addDaysKey: 月またぎ・年またぎ', () => { eq(C.addDaysKey('2026-01-31', 1), '2026-02-01'); eq(C.addDaysKey('2026-01-01', -1), '2025-12-31'); eq(C.addDaysKey('2026-12-31', 1), '2027-01-01'); });
await test('addDaysKey: うるう年', () => { eq(C.addDaysKey('2028-02-28', 1), '2028-02-29'); eq(C.addDaysKey('2026-02-28', 1), '2026-03-01'); eq(C.addDaysKey('2028-03-01', -1), '2028-02-29'); });
await test('addDaysKey: 365日を1日ずつ進めても抜け・重複なし', () => { let k = '2026-01-01'; const seen = new Set([k]); for (let i = 0; i < 365; i++) { k = C.addDaysKey(k, 1); seen.add(k); } eq(seen.size, 366); eq(k, '2027-01-01'); });
await test('isKey: 形式と実在日', () => { ok(C.isKey('2026-09-17')); ok(!C.isKey('2026-02-30')); ok(!C.isKey('2026-9-17')); ok(!C.isKey('<b>')); ok(!C.isKey(null)); });
await test('slash / md', () => { eq(C.slash('2026-09-17'), '2026/09/17'); eq(C.md('2026-09-17'), '09/17'); });
await test('shiftMonth: 年またぎ', () => { eq(C.shiftMonth(2026, 0, -1), [2025, 11]); eq(C.shiftMonth(2026, 11, 1), [2027, 0]); eq(C.shiftMonth(2026, 5, 1), [2026, 6]); });
await test('calendarCells: 2026年9月は5週・8/30始まり', () => { const c = C.calendarCells(2026, 8); eq(c.length, 35); eq(c[0], { key: '2026-08-30', day: 30, out: true }); eq(c[2], { key: '2026-09-01', day: 1, out: false }); eq(c[34].key, '2026-10-03'); });
await test('calendarCells: 2026年2月は日曜始まりの4週', () => { const c = C.calendarCells(2026, 1); eq(c.length, 28); eq(c[0].key, '2026-02-01'); ok(c.every(x => !x.out)); });
await test('calendarCells: 6週になる月（2026年8月）', () => eq(C.calendarCells(2026, 7).length, 42));

/* ================= calc: 期間集計 ================= */
group('calc: 期間集計の境界');
const T = '2026-09-17';
const one = kg => dayOf({ ex: 'a', sets: [set(kg, 1)] });
const days = {
  [T]: one(1), [C.addDaysKey(T, -6)]: one(10), [C.addDaysKey(T, -7)]: one(100),
  [C.addDaysKey(T, -27)]: one(1000), [C.addDaysKey(T, -28)]: one(10000), [C.addDaysKey(T, -41)]: one(100000), [C.addDaysKey(T, -42)]: one(1000000),
};
await test('7日間 = 今日を含む直近7日（6日前は含む・7日前は含まない）', () => eq(C.rangeVol(days, T, 0, 6), 11));
await test('28日間 = 直近28日（27日前は含む・28日前は含まない）', () => eq(C.rangeVol(days, T, 0, 27), 1111));
await test('総合計 = 全期間', () => eq(C.totalVol(days), 1111111));
await test('週別バー = 今日起点で7日ずつ6本', () => eq(C.weeklyVols(days, T, 6), [11, 100, 0, 1000, 10000, 100000]));
await test('週別バーに42日前は入らない', () => eq(C.weeklyVols(days, T, 6).reduce((a, b) => a + b, 0), 111111));
await test('未来の日付は 7日間に入らない', () => eq(C.rangeVol({ [C.addDaysKey(T, 1)]: one(5) }, T, 0, 6), 0));
await test('データ無しは 0', () => { eq(C.rangeVol({}, T, 0, 6), 0); eq(C.totalVol({}), 0); eq(C.weeklyVols({}, T).length, 6); });
await test('MONTHLY ARCHIVE = 表示月の実施日数（有効セットのある日だけ）', () => {
  const d = { '2026-09-01': one(1), '2026-09-30': one(1), '2026-08-31': one(1), '2026-10-01': one(1), '2026-09-10': { memo: 'メモだけ', items: [] }, '2026-09-11': dayOf({ ex: 'a', sets: [set(10, 0)] }) };
  eq(C.monthDays(d, 2026, 8), 2); eq(C.monthDays(d, 2026, 7), 1); eq(C.monthDays(d, 2026, 10), 0); eq(C.totalDays(d), 4);
});
await test('monthDays: 1月と11月を取り違えない', () => { const d = { '2026-01-05': one(1), '2026-11-05': one(1), '2026-10-05': one(1) }; eq(C.monthDays(d, 2026, 0), 1); eq(C.monthDays(d, 2026, 10), 1); });
await test('inRange: range日前は含む、0 は全期間', () => { ok(C.inRange(C.addDaysKey(T, -30), T, 30)); ok(!C.inRange(C.addDaysKey(T, -31), T, 30)); ok(C.inRange('2001-01-01', T, 0)); });

group('calc: 履歴・コピー');
const hdays = {
  '2026-09-10': dayOf({ ex: 'bp', sets: [set(70, 10)] }, { ex: 'sq', sets: [set(90, 5)] }),
  '2026-09-12': dayOf({ ex: 'bp', sets: [set(72.5, 8, 'きつい', true), set(60, 0)] }),
  '2026-09-14': dayOf({ ex: 'bp', sets: [set(80, 0)] }),
  '2026-09-15': dayOf({ ex: 'sq', sets: [set(95, 5)] }),
};

await test('exHistory: beforeKey は「選択日より前」（当日を含まない）', () => { eq(C.exHistory(hdays, 'bp', '2026-09-12').map(h => h.k), ['2026-09-10']); eq(C.exHistory(hdays, 'bp', '2026-09-10').length, 0); });
await test('copySets: 重量・回数のみ（メモ・補助はコピーしない、無効セット除外）', () => eq(C.copySets(hdays['2026-09-12'].items[0]), [{ w: 72.5, r: 8, memo: '', assist: false }]));
await test('recentTrainedKeys: 選択日より前だけ（当日・未来日は出さない）', () => {
  eq(C.recentTrainedKeys(hdays, '2026-09-12'), ['2026-09-10']); eq(C.recentTrainedKeys(hdays, '2026-09-10'), []); eq(C.recentTrainedKeys(hdays, '2026-09-11'), ['2026-09-10']);
});
await test('recentTrainedKeys: 新しい順・有効セットのある日だけ・件数上限', () => {
  eq(C.recentTrainedKeys(hdays, '2026-09-15'), ['2026-09-12', '2026-09-10']); eq(C.recentTrainedKeys(hdays, '2099-01-01'), ['2026-09-15', '2026-09-12', '2026-09-10']);
  const many = {}; for (let i = 1; i <= 40; i++) many[C.addDaysKey(T, -i)] = one(1);
  const r = C.recentTrainedKeys(many, T, 30); eq(r.length, 30); eq(r[0], C.addDaysKey(T, -1));
});
await test('mergeCopyDay: 既にある種目は重複追加しない', () => {
  const dst = { memo: 'm', items: [{ ex: 'bp', sets: [set(50, 5)] }] };
  const { day, added } = C.mergeCopyDay(dst, hdays['2026-09-10']);
  eq(added, 1); eq(day.items.map(i => i.ex), ['bp', 'sq']); eq(day.items[0].sets[0].w, 50); eq(day.memo, 'm'); eq(dst.items.length, 1, '元データは変更しない');
});
await test('mergeCopyDay: コピー先が空(null)でもよい', () => { const { day, added } = C.mergeCopyDay(null, hdays['2026-09-12']); eq(added, 1); eq(day.items[0].sets, [{ w: 72.5, r: 8, memo: '', assist: false }]); });

group('calc: ルーティング・選択日の復元・グラフ目盛り・同名チェック');
await test('parseHash: #/pick/<date> と #/entry/<date>/<exId>', () => {
  eq(C.parseHash('#/pick/2026-09-10', T), { name: 'pick', date: '2026-09-10', ex: null, hash: '#/pick/2026-09-10' });
  eq(C.parseHash('#/entry/2026-09-10/bp', T), { name: 'entry', date: '2026-09-10', ex: 'bp', hash: '#/entry/2026-09-10/bp' });
});
await test('parseHash: 不正な日付は今日にフォールバック（URL も正規化）', () => {
  eq(C.parseHash('#/entry/2026-02-30/bp', T).hash, '#/entry/' + T + '/bp'); eq(C.parseHash('#/entry/<script>/bp', T).date, T);
  eq(C.parseHash('#/pick', T).hash, '#/pick/' + T); eq(C.parseHash('#/pick/abc', T).date, T);
});
await test('parseHash: 日付は 2000-01-01〜今日+1年 の範囲外なら今日にフォールバック', () => {
  eq(C.dateMax('2026-09-17'), '2027-09-17'); eq(C.dateMax('2028-02-29'), '2029-03-01');
  eq(C.parseHash('#/pick/2000-01-01', T).date, '2000-01-01'); eq(C.parseHash('#/pick/1999-12-31', T).date, T);
  eq(C.parseHash('#/entry/2027-09-17/bp', T).date, '2027-09-17'); eq(C.parseHash('#/entry/2027-09-18/bp', T).date, T); eq(C.parseHash('#/entry/9999-12-31/bp', T).hash, '#/entry/' + T + '/bp');
  ok(C.isUsableDate(T, T)); ok(!C.isUsableDate('2026-02-30', T)); ok(!C.isUsableDate('0001-01-01', T));
  eq(C.restoreDate(JSON.stringify({ date: '1999-01-01', on: T }), T), T, '選択日の復元も同じ範囲');
});
await test('findSamePart: 同名の部位（前後空白は無視）を検出、自分自身は除外', () => {
  const ps = [{ id: 'chest', name: '胸' }, { id: 'x1', name: '有酸素', hidden: true }];
  eq(C.findSamePart(ps, ' 胸 ').id, 'chest'); eq(C.findSamePart(ps, '胸', 'chest'), null); eq(C.findSamePart(ps, '有酸素').hidden, true); eq(C.findSamePart(ps, '背中'), null);
});
await test('parseHash: 旧形式 #/entry/<exId> は今日の日付として解釈', () => eq(C.parseHash('#/entry/bp', T), { name: 'entry', date: T, ex: 'bp', hash: '#/entry/' + T + '/bp' }));
await test('parseHash: history は日付非依存、タブ画面、未知の画面、空', () => {
  eq(C.parseHash('#/history/bp', T), { name: 'history', date: null, ex: 'bp', hash: '#/history/bp' }); eq(C.parseHash('#/body', T).hash, '#/body');
  eq(C.parseHash('#/nope', T), null); eq(C.parseHash('#/<script>', T), null); eq(C.parseHash('', T).name, 'home');
  eq(C.parseHash('#/entry/2026-09-10/x%2Fy', T).ex, 'x/y'); eq(C.parseHash('#/entry/2026-09-10/%E0%A4%A', T).ex, null, '壊れたエンコードでも落ちない');
});
await test('restoreDate: 保存した日と同じ日のうちだけ復元、不正値は今日', () => {
  eq(C.restoreDate(JSON.stringify({ date: '2026-09-10', on: T }), T), '2026-09-10'); eq(C.restoreDate(JSON.stringify({ date: '2026-09-10', on: '2026-09-16' }), T), T, '翌日は今日に戻す');
  eq(C.restoreDate(JSON.stringify({ date: '2026-02-30', on: T }), T), T); eq(C.restoreDate('{こわれ', T), T); eq(C.restoreDate(null, T), T); eq(C.restoreDate('"x"', T), T);
});
await test('chartTicks: 実データの 最小・中間・最大（範囲外の値を出さない）', () => { eq(C.chartTicks([60, 75, 70]), [60, 67.5, 75]); eq(C.chartTicks([72.4, 72.4]), [72.4]); eq(C.chartTicks([5]), [5]); eq(C.chartTicks([]), []); });
await test('normRmReps: 1〜999 の整数', () => { eq(C.normRmReps('0'), 1); eq(C.normRmReps('8.4'), 8); eq(C.normRmReps('5000'), 999); eq(C.normRmReps('-3'), null); eq(C.normRmReps(''), null); });
await test('findSameName: 同じ部位の同名（前後空白は無視）だけ検出、自分自身は除外', () => {
  const ex = [{ id: 'a', part: 'chest', name: 'ベンチプレス' }, { id: 'b', part: 'back', name: '懸垂' }, { id: 'c', part: 'chest', name: 'フライ', hidden: true }];
  eq(C.findSameName(ex, 'chest', ' ベンチプレス ').id, 'a'); eq(C.findSameName(ex, 'back', 'ベンチプレス'), null); eq(C.findSameName(ex, 'chest', 'ベンチプレス', 'a'), null);
  eq(C.findSameName(ex, 'chest', 'フライ').hidden, true); eq(C.findSameName(ex, 'chest', 'ベンチ'), null);
});
await test('normName: trim＋40文字', () => { eq(C.normName('  a  '), 'a'); eq(C.normName('x'.repeat(50)).length, 40); eq(C.normName(null), ''); });

group('calc: 入力値の正規化');
await test('normW: 空→null、負数・非数→null（無視）', () => { eq(C.normW(''), null); eq(C.normW('  '), null); eq(C.normW('-5'), null); eq(C.normW('abc'), null); eq(C.normW(NaN), null); eq(C.normW(Infinity), null); eq(C.normW(null), null); });
await test('normW: 0〜999.5 に収める', () => { eq(C.normW('0'), 0); eq(C.normW('72.5'), 72.5); eq(C.normW('999.5'), 999.5); eq(C.normW('1000'), 999.5); eq(C.normW('1e9'), 999.5); eq(C.normW('21.25'), 21.25); eq(C.normW('10.129'), 10.13); });
await test('normR: 0〜999 の整数', () => { eq(C.normR(''), null); eq(C.normR('-1'), null); eq(C.normR('x'), null); eq(C.normR('10'), 10); eq(C.normR('10.6'), 11); eq(C.normR('99999'), 999); eq(C.normR('0'), 0); });

/* ================= フェーズ2: Firebase 同期（SDK はモックに差し替え。実際の通信はしない） ================= */
const cloneJ = o => JSON.parse(JSON.stringify(o));
const tick = (ms = 15) => new Promise(r => setTimeout(r, ms));
/** Firestore モジュラーAPI の最小モック（メモリ内）。online=false の間は書き込みの Promise が解決しない */
class FakeFs {
  constructor() { this.docs = new Map(); this.pending = new Set(); this.listeners = []; this.online = true; this.acks = []; this.silent = false; this.denied = false; this.rejectWrites = null; this.batches = []; this.writes = []; this.fromCache = false; }
  initializeFirestore() { return { fake: true }; } getFirestore() { return { fake: true }; }
  persistentLocalCache(o) { return { kind: 'persistent', ...o }; } persistentMultipleTabManager() { return { kind: 'multi' }; } memoryLocalCache() { return { kind: 'memory' }; }
  collection(db, ...seg) { return { type: 'col', path: seg.join('/') }; }
  doc(db, ...seg) { return { type: 'doc', path: seg.join('/'), id: seg[seg.length - 1] }; }
  _check(v, at) { if (v === undefined) throw new Error('undefined を Firestore に渡した: ' + at); if (v && typeof v === 'object') Object.keys(v).forEach(k => this._check(v[k], at + '.' + k)); }
  _snap(path) { const has = this.docs.has(path), d = this.docs.get(path); return { id: path.split('/').pop(), exists: () => has, data: () => (has ? cloneJ(d) : undefined), metadata: { hasPendingWrites: this.pending.has(path), fromCache: this.fromCache } }; }
  _emit(l) {
    if (l.ref.type === 'doc') { l.next(this._snap(l.ref.path)); return; }
    const depth = l.ref.path.split('/').length + 1, cur = new Map(), changes = [];
    for (const [pth, d] of this.docs) if (pth.startsWith(l.ref.path + '/') && pth.split('/').length === depth) cur.set(pth, JSON.stringify(d));
    for (const [pth, j] of cur) { if (!l.prev.has(pth)) changes.push({ type: 'added', doc: this._snap(pth) }); else if (l.prev.get(pth) !== j) changes.push({ type: 'modified', doc: this._snap(pth) }); }
    for (const pth of l.prev.keys()) if (!cur.has(pth)) changes.push({ type: 'removed', doc: { id: pth.split('/').pop(), metadata: { hasPendingWrites: false }, data: () => undefined } });
    l.prev = cur;
    l.next({ docs: [...cur.keys()].map(x => this._snap(x)), docChanges: () => changes, metadata: { fromCache: this.fromCache } });
  }
  _emitAll() { if (!this.silent) this.listeners.slice().forEach(l => this._emit(l)); }
  onSnapshot(ref, opt, next, err) {
    const l = { ref, next, err, prev: new Map() }; this.listeners.push(l);
    if (this.denied) setTimeout(() => err({ code: 'permission-denied', message: 'Missing or insufficient permissions.' }), 0);
    else if (!this.silent) setTimeout(() => { if (this.listeners.includes(l)) this._emit(l); }, 0);
    return () => { this.listeners = this.listeners.filter(x => x !== l); };
  }
  _ack(path) { return new Promise((res, rej) => { const fin = () => { this.pending.delete(path); if (this.rejectWrites) { this.docs.delete(path); this._emitAll(); rej(this.rejectWrites); } /* 実物同様、拒否された書き込みは取り消される */ else { this._emitAll(); res(); } }; if (this.online) setTimeout(fin, 0); else this.acks.push(fin); }); }
  setDoc(ref, data) { this._check(data, ref.path); this.writes.push('set ' + ref.path); this.docs.set(ref.path, cloneJ(data)); this.pending.add(ref.path); this._emitAll(); return this._ack(ref.path); }
  deleteDoc(ref) { this.writes.push('delete ' + ref.path); this.docs.delete(ref.path); this._emitAll(); return this._ack(ref.path); }
  goOnline() { this.online = true; this.acks.splice(0).forEach(f => f()); }
  remoteSet(path, data) { this.docs.set(path, cloneJ(data)); this._emitAll(); }      // 他端末からの変更
  remoteDelete(path) { this.docs.delete(path); this._emitAll(); }
  async getDocsFromServer(col) { if (!this.online) throw { code: 'unavailable' }; if (this.denied) throw { code: 'permission-denied' }; const depth = col.path.split('/').length + 1; return { docs: [...this.docs.keys()].filter(x => x.startsWith(col.path + '/') && x.split('/').length === depth).map(x => this._snap(x)) }; }
  async getDocFromServer(ref) { if (!this.online) throw { code: 'unavailable' }; this.serverReads = (this.serverReads || 0) + 1; return this._snap(ref.path); }
  writeBatch() { const ops = [], self = this; return { set(ref, data) { self._check(data, ref.path); ops.push([ref.path, data]); }, async commit() { if (ops.length > 500) throw new Error('batch が 500 件を超えた: ' + ops.length); if (!self.online) throw { code: 'unavailable' }; ops.forEach(([pth, d]) => self.docs.set(pth, cloneJ(d))); self.batches.push(ops.length); self._emitAll(); } }; }
}

group('Firebase: ログイン〜移行〜ログアウトの流れ（Auth / Firestore モック）');
function mkCloud({ user = null, fs = new FakeFs(), mem = new MemStorage(), loadFail = false, popup = null } = {}) {
  const calls = [], toasts = [], confirms = [], authObj = { currentUser: user }, ls = [], bus = new EventTarget();
  const sdk = { app: { initializeApp: c => ({ c }) }, fs,
    auth: { getAuth: () => authObj, GoogleAuthProvider: class { setCustomParameters(x) { calls.push('params:' + x.prompt); } },
      signInWithPopup: (a, pr) => { calls.push('popup'); if (popup) return popup(); const u = { uid: 'u1', email: 'me@example.com', displayName: 'Me' }; return Promise.resolve().then(() => { authObj.currentUser = u; ls.forEach(f => f(u)); return { user: u }; }); },
      signOut: () => { calls.push('signOut'); authObj.currentUser = null; ls.forEach(f => f(null)); return Promise.resolve(); },
      onAuthStateChanged: (a, cb) => { ls.push(cb); setTimeout(() => cb(authObj.currentUser), 0); return () => {}; } } };
  const store = St.createStore(new St.LocalAdapter(mem, null));
  const cloud = CL.createCloud({ store, loadSdk: () => (loadFail ? Promise.reject(new Error('offline')) : Promise.resolve(sdk)), createAuth: AU.createAuth, config: CFG.firebaseConfig,
    toast: m => toasts.push(m), confirm: (o, okCb) => confirms.push({ o, ok: okCb }), busy: () => false, makeLocalAdapter: () => new St.LocalAdapter(mem, null),
    readLocal: async () => St.normalizeAll(await new St.LocalAdapter(mem, null).load()), storage: mem, events: bus, doc: null, adapterTimeoutMs: 150, sdkTimeoutMs: 500, backoff: [60000] });
  const settle = async () => { for (let i = 0; i < 4; i++) { await tick(20); await cloud.idle(); } };
  return { cloud, store, fs, mem, calls, toasts, confirms, bus, settle };
}

  x.cloud.signIn(); x.cloud.signIn(); x.cloud.signIn(); eq(x.calls.filter(c => c === 'popup').length, 1); eq(x.cloud.state().signingIn, true);
  const n = x.toasts.length; rejectPopup({ code: 'auth/cancelled-popup-request' }); await tick(); eq(x.cloud.state().signingIn, false); eq(x.toasts.length, n, 'トーストなし');
  x.cloud.signIn(); eq(x.calls.filter(c => c === 'popup').length, 2); rejectPopup({ code: 'auth/popup-closed-by-user' }); await tick(); ok(x.toasts[x.toasts.length - 1].includes('キャンセル'));
});
await test('F7: SDK 取得失敗の状態でログインを押した時のメッセージは1つだけ', async () => {
  const x = mkCloud({ loadFail: true }); await x.store.init(); await x.cloud.start(); const n = x.toasts.length;
  x.cloud.signIn(); await tick(60); eq(x.toasts.length, n + 1); ok(x.toasts[n].includes('オフラインのためログインできません'));
});

/* ================= photo-layout: 記録写真（仕様書06 4.4〜4.5） ================= */
group('photo-layout: 記録写真の純粋関数（収まり判定・文字列）');
const nameOf = id => ({ sp: 'ショルダープレス', sr: 'サイドレイズ' }[id] || '（不明な種目）'), colorOf = id => (id === 'sp' || id === 'sr' ? '#8A63C9' : 'var(--ink-2)');
await test('fitPlan: 収まる時は scale 1.0・全種目', () => { eq(PL.fitPlan([4, 3, 2, 3], 5000, 1), { scale: 1, count: 4 }); eq(PL.fitPlan([4], PL.needH([4], 1, 1), 1), { scale: 1, count: 1 }); });
await test('fitPlan: カード高 = 18×2 + 36 + 40×セット数、間隔 14（× u）', () => { eq(PL.cardH(4, 1, 1), 232); eq(PL.cardH(4, 0.5, 1), 116); eq(PL.needH([4, 3], 1, 1), 232 + 192 + 14); eq(PL.needH([], 1, 1), 0); });
await test('fitPlan: 1px でも足りなければ 0.05 刻みで縮小（最初に収まる scale）', () => {
  eq(PL.fitPlan([4], 231, 1), { scale: 0.95, count: 1 });
  const r = PL.fitPlan([4, 4, 4, 4], 700, 1); eq(r.count, 4); ok(PL.needH([4, 4, 4, 4], 1, r.scale) <= 700); ok(PL.needH([4, 4, 4, 4], 1, Math.round((r.scale + 0.05) * 100) / 100) > 700, 'ひとつ大きい scale でも収まってしまう');
  ok([1, .95, .9, .85, .8, .75, .7, .65, .6].includes(r.scale), 'scale が 0.05 刻みでない: ' + r.scale);
});
await test('fitPlan: 0.6 でも収まらない時は 0.6 のまま末尾から外し、「他 N 種目」の行の分も確保する', () => {
  const sc = [4, 4, 4, 4, 4, 4, 4, 4], r = PL.fitPlan(sc, 1000, 1);
  eq(r.scale, 0.6); ok(r.count < 8 && r.count > 0, 'count=' + r.count);
  ok(PL.needH(sc.slice(0, r.count), 1, 0.6) + PL.OTHERS_H <= 1000); ok(PL.needH(sc.slice(0, r.count + 1), 1, 0.6) + PL.OTHERS_H > 1000, 'もう1枚入る');
  eq(PL.fitPlan([4], 10, 1), { scale: 0.6, count: 0 });
});
await test('fitPlan: 空配列は scale 1.0・0 枚', () => { eq(PL.fitPlan([], 100, 1), { scale: 1, count: 0 }); });
await test('photoText: 日付・曜日・今日表記', () => {
  const t = PL.photoText(dayOf(), '2026-10-08', '2026-10-08', nameOf, colorOf); eq(t.date, '2026/10/08'); eq(t.sub, '(木) 今日'); eq(t.items, []);
  eq(PL.photoText(dayOf(), '2026-10-08', '2026-10-09', nameOf, colorOf).sub, '(木)'); eq(PL.photoText(null, '2026-10-10', '2026-10-10', nameOf, colorOf).sub, '(土) 今日');
});
await test('photoText: 種目名・部位色・RM（w×(1+r/40) の最大を小数2桁）', () => {
  const t = PL.photoText(dayOf({ ex: 'sp', sets: [set(45, 10), set(45, 10), set(50, 6), set(40, 8)] }), '2026-10-08', '2026-10-08', nameOf, colorOf);
  eq(t.items.length, 1); eq(t.items[0].name, 'ショルダープレス'); eq(t.items[0].color, '#8A63C9'); eq(t.items[0].rm, '57.50');
  eq(t.items[0].sets, [{ n: 1, w: '45.0', r: 10, assist: false }, { n: 2, w: '45.0', r: 10, assist: false }, { n: 3, w: '50.0', r: 6, assist: false }, { n: 4, w: '40.0', r: 8, assist: false }]);
});
await test('photoText: 重量が空なら 0.0、1.25 刻みは小数2桁、assist は true', () => {
  const t = PL.photoText(dayOf({ ex: 'sr', sets: [set(null, 12), set(11.25, 8, '', true)] }), '2026-10-08', '2026-10-08', nameOf, colorOf);
  eq(t.items[0].sets, [{ n: 1, w: '0.0', r: 12, assist: false }, { n: 2, w: '11.25', r: 8, assist: true }]); eq(t.items[0].rm, '13.50');
});
await test('photoText: セットのメモは載せない・無効セット（回数0）は除く・有効セットの無い種目は除く・不明な種目名', () => {
  const t = PL.photoText(dayOf({ ex: 'sp', sets: [set(40, 10, 'きつかった'), set(40, 0, 'x')] }, { ex: 'sr', sets: [set(10, 0)] }, { ex: 'zz', sets: [set(20, 5)] }), '2026-10-08', '2026-10-08', nameOf, colorOf);
  eq(t.items.map(i => i.name), ['ショルダープレス', '（不明な種目）']); eq(t.items[0].sets.length, 1); ok(!('memo' in t.items[0].sets[0])); eq(JSON.stringify(t).includes('きつかった'), false); eq(t.items[1].color, 'var(--ink-2)');
});
await test('photoText: 種目なし・day なしは items: []', () => { eq(PL.photoText({ memo: 'x', items: [] }, '2026-10-08', '2026-10-08', nameOf, colorOf).items, []); eq(PL.photoText(undefined, '2026-10-08', '2026-10-08', nameOf, colorOf).items, []); });

group('Firebase: 設定・SW・ルールの整合');
await test('firebaseConfig と SDK の URL', () => { eq(CFG.firebaseConfig.projectId, 'workout-note-b45cd'); eq(CFG.firebaseConfig.authDomain, 'workout-note-b45cd.firebaseapp.com'); ok(/^\d+\.\d+\.\d+$/.test(CFG.SDK_VERSION)); eq(CFG.SDK_BASE, 'https://www.gstatic.com/firebasejs/' + CFG.SDK_VERSION + '/'); eq(CFG.SDK_FILES, ['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js']); });
await test('sw.js: SDK バージョンが一致し、新規ファイルがアプリシェルに入っている／API・認証の通信には触らない', async () => {
  const sw = await (await fetch('../app/sw.js', { cache: 'no-store' })).text();
  eq(sw.match(/const SDK_VERSION = '([^']+)'/)[1], CFG.SDK_VERSION); eq(sw.match(/const CACHE_VERSION = '([^']+)'/)[1], 'v' + D.APP_VERSION); eq(D.APP_VERSION, '1.2.1');
  ['js/firebase-config.js', 'js/auth.js', 'js/store-firebase.js', 'js/migrate.js', 'js/cloud.js', 'js/photo.js', 'js/photo-layout.js'].forEach(f => ok(sw.includes("'" + f + "'"), f + ' が SHELL に無い'));
  const code = sw.split('\n').filter(l => !l.trim().startsWith('//')).join('\n'); ['firestore.googleapis.com', 'identitytoolkit', 'securetoken', 'apis.google.com', 'firebaseapp.com'].forEach(h => ok(!code.includes(h), h + ' を SW のコードで扱っている'));
});
await test('firestore.rules: 本人だけが自分の users/{uid} 以下を読み書きできる', async () => {
  const r = await (await fetch('../firestore.rules', { cache: 'no-store' })).text(); ok(r.includes("rules_version = '2'")); ok(r.includes('match /users/{uid}/{document=**}')); ok(r.includes('allow read, write: if request.auth != null && request.auth.uid == uid;'));
});
